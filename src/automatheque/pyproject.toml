[project]
name = "automatheque"
version = "0.23.0"
description = "Bibliothèque pour se faciliter le scripting !"
authors = [
    { name = "Marc", email = "githubmarc@maj44.com" },
]
license = { text = "LGPL-3.0-or-later" }
requires-python = ">=3.10"
readme = "README.md"
classifiers = [
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    # docopt-ng : fork maintenu de docopt, même module importable `docopt`
    # (drop-in). Aligné avec commandopt, qui s'appuie lui aussi sur docopt-ng
    # (#4). Borné < 1 : garde-fou contre une 1.0 à breaking changes.
    "docopt-ng>=0.9,<1",
    # Dispatch de sous-commandes dans @script_automatheque (#39). La borne
    # >=1.0.0rc1 embarque volontairement la RC : automatheque sert de banc de
    # validation à la 1.0 de commandopt. <2 : garde-fou contre une 2.0.
    "commandopt>=1.0.0rc1,<2",
    # tzdata : base de fuseaux IANA (données `zoneinfo` sous Windows / image
    # slim) ET table pays→fuseau `zone1970.tab` lue par
    # `util.structures_python`. Remplace `pytz` (dont on tirait la même table).
    "tzdata",
    "pyyaml",
    "attrs>=19.2",
]

[project.urls]
Home = "https://github.com/jaegerbobomb/automatheque/tree/main/src/automatheque/"
Repository = "https://github.com/jaegerbobomb/automatheque.git"

[build-system]
requires = [
    "setuptools>=61",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Embarque LICENSE + GPL dans sdist/wheel (LGPL-3.0-or-later). Cf. #116.
license-files = ["LICENSE", "GPL-3.0.txt"]

# Embarque le marqueur py.typed dans le wheel (sinon mypy côté consommateur ne
# voit pas le typage exporté). Cf. #3.
[tool.setuptools.package-data]
automatheque = ["py.typed"]

[project.optional-dependencies]
dev = [
    "pytest",
]
