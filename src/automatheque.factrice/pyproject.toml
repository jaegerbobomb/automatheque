[project]
name = "automatheque.factrice"
version = "0.23.0"
description = "Librairie et app simplifiée d'envoi de mail"
authors = [{name = "Marc", email = "githubmarc@maj44.com"}]
license = {text = "LGPL-3.0-or-later"}
requires-python = ">=3.10"
readme = "README.md"
classifiers = [
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    # >=0.19.0 : `ExpeditriceSmtp` utilise `automatheque.secret.recup_secret`
    # pour récupérer le mot de passe SMTP (#8), module ajouté en automatheque
    # 0.19.0. (Auparavant >=0.14.0 pour `Executant.exec(encoding=...)`, #66.)
    "automatheque>=0.19.0",
    # >=0.9.7 : factrice construit un `Courriel` SANS émetteur (celui-ci est
    # rempli ensuite par l'expéditrice, depuis la configuration). Or l'émetteur
    # n'est devenu **facultatif** dans le constructeur de `Courriel` qu'en
    # schema 0.9.7 ; avec 0.9.6 la construction lève `TypeError`. Le job CI
    # « tests-plancher » éprouve réellement ce plancher.
    "automatheque.schema>=0.9.7",
]

[project.urls]
Home = "https://github.com/jaegerbobomb/automatheque"
Repository = "https://github.com/jaegerbobomb/automatheque.git"

[project.scripts]
factrice = "automatheque.factrice.app:main"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Embarque LICENSE + GPL dans sdist/wheel (LGPL-3.0-or-later). Cf. #116.
license-files = ["LICENSE", "GPL-3.0.txt"]

# Embarque le marqueur py.typed dans le wheel (typage exporté). Cf. #3.
[tool.setuptools.package-data]
"automatheque.factrice" = ["py.typed"]
