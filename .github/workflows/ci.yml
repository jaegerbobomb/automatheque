name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Installe Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installe les paquets (editable) et les dépendances de test
        # La liste des paquets est **dérivée de `src/*`**, comme
        # `[tool.monas] packages` à la racine. Elle était auparavant codée en
        # dur ici (et dans le job `qualite`) : un paquet ajouté à `src/`
        # n'était alors ni testé ni publié, en silence. Cf. #106.
        run: |
          python -m pip install --upgrade pip
          pip install $(printf -- '-e %s ' src/*/)
          # vobject : extra `automatheque.schema[calendrier]`. Les extras ne
          # s'installent pas avec `-e src/…`, et sans lui les tests de
          # conversion iCalendar se sauteraient silencieusement
          # (`pytest.importorskip`).
          pip install pytest pytest-cov vobject

      - name: Lance les tests avec couverture
        run: pytest src --cov=automatheque --cov-report=term-missing

  tests-plancher:
    # Lower-bound testing : le job « tests » ci-dessus installe les paquets
    # intra-dépôt en editable, donc les planchers de version déclarés par
    # factrice (ex. `automatheque>=0.9.6`) ne sont jamais réellement éprouvés.
    # Ici on installe explicitement ces planchers depuis PyPI puis on lance les
    # tests de factrice : on garantit ainsi que les planchers sont *vrais*
    # (pas de régression à la version minimale annoncée), au lieu d'une simple
    # affirmation. Cf. #33.
    name: Tests factrice contre les versions planchers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installe Python 3.10 (plus basse version supportée par la CI)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installe les planchers déclarés par factrice (depuis PyPI)
        # Les planchers sont *dérivés* du pyproject de factrice (et non codés en
        # dur ici) : si un plancher est relevé, ou s'il référence une version
        # non publiée, ce job suit automatiquement / casse — ce qui est le but.
        run: |
          python -m pip install --upgrade pip tomli
          python - <<'PY'
          import re
          import subprocess
          import sys

          try:
              import tomllib
          except ModuleNotFoundError:  # Python < 3.11
              import tomli as tomllib

          chemin = "src/automatheque.factrice/pyproject.toml"
          with open(chemin, "rb") as f:
              data = tomllib.load(f)

          pins = []
          for dep in data["project"]["dependencies"]:
              # On ne traite que les dépendances intra-dépôt (préfixe automatheque).
              if not re.match(r"\s*automatheque", dep):
                  continue
              m = re.match(r"\s*([A-Za-z0-9_.\-]+)\s*>=\s*([0-9][^,;\s]*)", dep)
              assert m, "Dépendance intra-dépôt sans plancher '>=' : {!r}".format(dep)
              pins.append("{}=={}".format(m.group(1), m.group(2)))

          print("Planchers déclarés :", pins)
          for pin in pins:
              nom, _, _version = pin.partition("==")
              try:
                  subprocess.check_call([sys.executable, "-m", "pip", "install", pin])
              except subprocess.CalledProcessError:
                  # Le plancher déclaré n'est pas (encore) publié sur PyPI —
                  # typiquement une version intra-dépôt livrée dans le MÊME cycle
                  # (co-release). On se rabat sur le build LOCAL (qui deviendra
                  # cette version) pour tester quand même factrice contre ce code,
                  # en le SIGNALANT (::warning::) pour ne pas masquer un plancher
                  # fantôme (version jamais publiée par erreur).
                  local = "src/" + nom
                  print(
                      "::warning::plancher {} introuvable sur PyPI ; "
                      "repli sur le build local {}".format(pin, local)
                  )
                  subprocess.check_call([sys.executable, "-m", "pip", "install", local])
          PY

      - name: Installe factrice depuis les sources (sans toucher aux planchers)
        run: |
          pip install --no-deps ./src/automatheque.factrice
          pip install pytest

      - name: Tests factrice contre les planchers
        run: pytest src/automatheque.factrice/tests -q

  qualite:
    name: Qualité (lint, format, types) — rapport
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installe Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installe les paquets et l'outillage qualité
        run: |
          python -m pip install --upgrade pip
          # Même dérivation de `src/*` que dans le job « tests ». Cf. #106.
          pip install $(printf -- '-e %s ' src/*/)
          # ruff et mypy sont ÉPINGLÉS : sans version fixe, `pip install` récupère
          # la dernière (qui change les règles de lint/format d'un jour à l'autre)
          # et fait échouer des PR sans rapport. On bumpe délibérément.
          # types-* : stubs pour pyyaml/pytz (typage de log.py / structures_python.py).
          pip install ruff==0.16.0 mypy==1.19.1 types-PyYAML

      # ruff et mypy sont désormais **bloquants** : le code a été nettoyé (#71).
      - name: Lint (ruff check)
        run: ruff check src

      - name: Format (ruff format --check)
        run: ruff format --check src

      - name: Vérification de types (mypy)
        run: mypy src/automatheque/automatheque

  attribution:
    # Filet de sécurité côté dépôt : aucun commit ne doit porter de mention de
    # session ou de modèle (cf. CLAUDE.md). L'intégration qui pilote un agent
    # peut injecter d'office un « Co-Authored-By: Claude » / « Claude-Session: ».
    # Le hook local `.githooks/commit-msg` le retire à la source ; ce job bloque
    # la PR même si ce hook n'est pas activé sur la machine qui a commité.
    name: Attribution propre (pas de mention session/modèle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commits sans mention de session/modèle (message ET auteur/committer)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          zero=0000000000000000000000000000000000000000
          if [ -n "$HEAD_SHA" ]; then
            plage="$BASE_SHA..$HEAD_SHA"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$zero" ]; then
            plage="$BEFORE_SHA..$PUSH_SHA"
          else
            plage="-1 $PUSH_SHA"
          fi
          echo "Plage inspectée : $plage"
          mauvais=0
          for h in $(git rev-list $plage); do
            # Message : aucun lien de chat/session. `Co-Authored-By: Claude`
            # est toléré (attribution) ; c'est le lien de session qui fuit.
            if git show -s --format='%B' "$h" | grep -qiE 'claude\.ai/code/session_|^Claude-Session:'; then
              echo "::error::commit $h — lien de session interdit (cf. CLAUDE.md) : $(git show -s --format='%s' "$h")"
              mauvais=1
            fi
            # Identité : ni l'auteur ni le committer ne doivent être « Claude »
            # / une adresse anthropic (fuite d'identité de modèle → aussi la
            # cause du « Unverified » sur GitHub, l'e-mail ne correspondant pas
            # à la clé de signature).
            if git show -s --format='%an|%ae|%cn|%ce' "$h" | grep -qiE 'claude|anthropic\.com'; then
              echo "::error::commit $h — auteur/committer interdit : $(git show -s --format='%an <%ae> / %cn <%ce>' "$h")"
              mauvais=1
            fi
          done
          if [ "$mauvais" = 1 ]; then
            echo "Corrigez le message (hook .githooks/commit-msg) et/ou l'identité git"
            echo "(git config user.name/user.email doivent être les vôtres, pas ceux d'un agent)."
            exit 1
          fi
          echo "OK : commits propres (message + identité)."

      - name: Le corps de la PR ne porte pas de lien de session/modèle
        # Complète la garde sur les commits : l'intégration ré-ajoute d'office un
        # pied de page « _Generated by [Claude Code](…/session…)_ » au CORPS des
        # PR (trou côté plateforme, cf. CLAUDE.md). On refuse ce corps ici.
        # Le corps est du texte non fiable : on le passe par une variable d'env,
        # jamais interpolé dans le script (sinon injection de commande).
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$PR_BODY" \
             | grep -qiE 'claude\.ai/code/session_'; then
            echo "::error::Le corps de la PR contient une mention de session/modèle interdite (cf. CLAUDE.md)."
            echo "Retirez la ligne (typiquement le pied de page « _Generated by [Claude Code](…session…)_ »)."
            exit 1
          fi
          echo "OK : corps de PR sans mention interdite."
